<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registrar documento - SG-SST</title>

    <!-- Hoja de estilos -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<!-- ENCABEZADO -->

<header>

    <h1>Gestión Documental SG-SST</h1>

    <p>
        Registro de nuevos documentos
    </p>

</header>


<!-- CONTENIDO -->

<main>

    <section>

        <h2>Registrar documento</h2>

        <p>
            Complete la información solicitada para registrar
            un nuevo documento del SG-SST.
        </p>


        <!-- MENSAJE DE ERROR -->

        {% if error %}

        <div class="mensaje-error">

            {{ error }}

        </div>

        {% endif %}


        <!-- FORMULARIO -->

        <form method="POST">


            <!-- Nombre -->

            <p>

                <label for="nombre">
                    Nombre del documento
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    required>

            </p>


            <!-- Tipo -->

            <p>

                <label for="tipo">
                    Tipo de documento
                </label>

                <select
                    id="tipo"
                    name="tipo"
                    required>

                    <option value="">
                        Seleccione un tipo
                    </option>

                    <option value="Política">
                        Política
                    </option>

                    <option value="Procedimiento">
                        Procedimiento
                    </option>

                    <option value="Matriz">
                        Matriz
                    </option>

                    <option value="Formato">
                        Formato
                    </option>

                    <option value="Plan">
                        Plan
                    </option>

                </select>

            </p>


            <!-- Responsable -->

            <p>

                <label for="responsable">
                    Responsable
                </label>

                <input
                    type="text"
                    id="responsable"
                    name="responsable"
                    required>

            </p>


            <!-- Fecha -->

            <p>

                <label for="fecha">
                    Fecha
                </label>

                <input
                    type="date"
                    id="fecha"
                    name="fecha"
                    required>

            </p>


            <!-- Versión -->

            <p>

                <label for="version">
                    Versión
                </label>

                <input
                    type="number"
                    id="version"
                    name="version"
                    min="1"
                    required>

            </p>


            <!-- Descripción -->

            <p>

                <label for="descripcion">
                    Descripción
                </label>

                <textarea
                    id="descripcion"
                    name="descripcion"
                    rows="5"></textarea>

            </p>


            <!-- Botón -->

            <button type="submit">
                Guardar documento
            </button>


        </form>

    </section>

</main>


<!-- PIE DE PÁGINA -->

<footer>

    Sistema de Gestión Documental SG-SST

</footer>


</body>

</html>
